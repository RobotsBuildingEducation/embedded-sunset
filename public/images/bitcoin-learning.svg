      <circle cx="66" cy="76" r="9" stroke-width=".8"/>
      <path d="m62 76 3 3 6-7" stroke-width="1.3"/>
    </g>
    <!-- A narrow woven bookmark follows the page, instead of floating beside it. -->
    <path d="M349 173c-7 24-6 52-2 81l-10-5-8 10c-5-33-5-56 3-81Z" fill="#819b83" stroke-width="1.1"/>
    <path d="M341 178c-5 21-6 44-3 65" stroke="#c9d2b8" stroke-width=".85"/>
