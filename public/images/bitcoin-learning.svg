<svg xmlns="http://www.w3.org/2000/svg" width="480" height="360" viewBox="0 0 480 360" fill="none">
  <title>Learning that travels</title>
  <desc>An open learning folio holds code, a transcript and an achievement seal. An engraved brass Bitcoin coin rises from its pages. Continuous routes connect equal peers around the folio, linking learning, portable progress and community support.</desc>
  <g stroke="#364c43" stroke-linecap="round" stroke-linejoin="round">
    <!-- A connected mesh: routes continue behind the objects, rather than orbiting a central hub. -->
    <g stroke="#97aa91" stroke-width="1.15">
      <path d="M48 164C27 104 96 49 195 51S393 65 430 178C457 257 381 319 269 324S82 275 48 164Z"/>
      <path d="M48 164C131 161 131 76 195 51M195 51C214 117 371 119 430 178M48 164C168 217 344 259 430 178"/>
      <path d="M89 92C179 11 369 18 416 133M38 192C34 236 79 283 139 301" stroke="#c7cdbb" stroke-width=".8"/>
    </g>
    <g fill="#fcf6e8" stroke-width="1.3">
      <circle cx="48" cy="164" r="8"/><circle cx="195" cy="51" r="8"/><circle cx="430" cy="178" r="8"/>
    </g>
    <g fill="#d9b46f" stroke-width=".8">
      <circle cx="48" cy="164" r="3"/><circle cx="195" cy="51" r="3"/><circle cx="430" cy="178" r="3"/>
    </g>
    <!-- The folio: a stitched cloth cover, several visible page edges, and a sewn spine. -->
    <path d="m78 185 154 39 150-43 10 100-156 53-165-44Z" fill="#a76f56" stroke-width="1.6"/>
    <path d="m82 187 151 41 148-43 7 91-153 52-158-43Z" fill="#ccaa83" stroke-width="1.2"/>
    <path d="m89 182 144 43 142-45 7 91-147 51-152-44Z" fill="#ede2c8" stroke-width="1.25"/>
    <path d="m89 267 146 47 141-48m-287-6 146 47 140-48" stroke="#b4a88b" stroke-width=".8"/>
    <path d="M91 176c49-7 99 12 143 39 43-28 94-50 139-44l3 89c-49-1-95 24-141 52-47-26-96-44-151-44Z" fill="#fcf6e8" stroke-width="1.7"/>
    <path d="M234 215c-4 34-3 64 1 97" stroke-width="1.25"/>
    <path d="M228 218c-4 26-3 57 1 82m11-84c-3 25-2 52 1 80" stroke="#c6bea7" stroke-width=".75"/>
    <path d="m87 291 147 35 150-47" stroke="#e4cbb0" stroke-width=".85" stroke-dasharray="2 5"/>
    <path d="m235 323-3 10 8 3 9-4-2-12" fill="#6e8572" stroke-width="1"/>
    <!-- Code on one page, a learner's own transcript on the other. -->
    <g transform="matrix(1 .28 -.06 .86 111 195)">
      <path d="m0 0 33 0m-33 5 52 0" stroke="#b9745b" stroke-width="1.5"/>
      <g stroke="#819b83" stroke-width="1.25">
        <path d="m7 23-7 6 7 6m33-12 7 6-7 6m-13-14-7 16"/>
        <path d="m0 49 16 0m6 0 40 0m-55 9 22 0m6 0 39 0m-60 9 12 0m6 0 32 0m-60 9 18 0m6 0 20 0"/>
      </g>
      <path d="m78 50 2 3 5-6m-7 15 2 3 5-6m-7 15 2 3 5-6" stroke="#364c43" stroke-width="1"/>
    </g>
    <g transform="matrix(.9 -.315 .018 .9 255 215)">
      <path d="m0 0 39 0m-39 5 55 0" stroke="#b9745b" stroke-width="1.5"/>
      <path d="m0 22 20 0m17 0 36 0m-73 10 20 0m17 0 36 0m-73 10 20 0m17 0 36 0m-73 10 20 0m17 0 36 0" stroke="#819b83" stroke-width="1"/>
      <path d="m28 18 0 37" stroke="#c7cdbb" stroke-width=".75"/>
      <path d="m4 70 23 0m-23 4 36 0" stroke="#a9b49a" stroke-width=".85"/>
