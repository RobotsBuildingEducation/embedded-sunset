      <ellipse cx="303" cy="108" rx="64" ry="70" fill="#d9b46f" stroke-width="1.7"/>
      <ellipse cx="303" cy="108" rx="58.5" ry="64.5" stroke="#f4e0b3" stroke-width="1.2"/>
      <g stroke="#806743" stroke-width=".8"><path d="M357.00 108.00 354.50 108.00"/><path d="M356.18 118.42 353.72 117.98"/><path d="M353.74 128.52 351.39 127.67"/><path d="M349.77 138.00 347.60 136.75"/><path d="M344.37 146.57 342.45 144.96"/><path d="M337.71 153.96 336.10 152.05"/><path d="M330.00 159.96 328.75 157.80"/><path d="M321.47 164.38 320.61 162.03"/><path d="M312.38 167.09 311.94 164.63"/><path d="M303.00 168.00 303.00 165.50"/><path d="M293.62 167.09 294.06 164.63"/><path d="M284.53 164.38 285.39 162.03"/><path d="M276.00 159.96 277.25 157.80"/><path d="M268.29 153.96 269.90 152.05"/><path d="M261.63 146.57 263.55 144.96"/><path d="M256.23 138.00 258.40 136.75"/><path d="M252.26 128.52 254.61 127.67"/><path d="M249.82 118.42 252.28 117.98"/><path d="M249.00 108.00 251.50 108.00"/><path d="M249.82 97.58 252.28 98.02"/><path d="M252.26 87.48 254.61 88.33"/><path d="M256.23 78.00 258.40 79.25"/><path d="M261.63 69.43 263.55 71.04"/><path d="M268.29 62.04 269.90 63.95"/><path d="M276.00 56.04 277.25 58.20"/><path d="M284.53 51.62 285.39 53.97"/><path d="M293.62 48.91 294.06 51.37"/><path d="M303.00 48.00 303.00 50.50"/><path d="M312.38 48.91 311.94 51.37"/><path d="M321.47 51.62 320.61 53.97"/><path d="M330.00 56.04 328.75 58.20"/><path d="M337.71 62.04 336.10 63.95"/><path d="M344.37 69.43 342.45 71.04"/><path d="M349.77 78.00 347.60 79.25"/><path d="M353.74 87.48 351.39 88.33"/><path d="M356.18 97.58 353.72 98.02"/></g>
      <ellipse cx="303" cy="108" rx="48" ry="54" fill="#e4c487" stroke="#806743" stroke-width=".85"/>
      <path d="M289 77v62m-6-61h24c23 0 25 27 2 29h-20m0 0h20c29 0 27 31 0 31h-26m13-70v10m13-10v10m-13 60v10m13-10v10" stroke="#695536" stroke-width="5.1"/>
      <path d="M267 91c4-16 14-28 27-32" stroke="#fff1d0" stroke-width="1.5"/>
      <path d="m330 130 7-5m-10 12 12-8m-16 16 13-9m-19 16 14-10" stroke="#ad8b53" stroke-width=".8"/>
    </g>
    <!-- Fine contact lines ground the object on the same plane as the folio. -->
    <g stroke="#b4bba6" stroke-width=".8">
      <path d="m102 313 67 18m-56-11 31 8m151 7 69-25m-51 24 42-15"/>
    </g>
  </g>
</svg>
